title: "Cite or missing: recruiter Fit without hallucination"
summary: >
  Why a JD fit brief should refuse aligned claims without citations.
body: >
  Recruiters need requirement-to-evidence mapping, not a chatty bio bot.
  The cite-or-missing contract marks gaps honestly and links only to published
  /work and /blog pages. Deterministic matchers are a safe v1; RAG can swap in
  later behind the same JSON shape.
