# Tenant Fit matcher overrides for the Fake Name demo.
# Core English stops + generic tech synonyms live in src/fit/config.ts.
# Person-name stops and skill weighting belong here — never hardcoded in fit-core.

extraStops:
  - fake
  - name

# Optional synonym additions / overrides (merged over defaults).
synonyms: {}

# Optional per-skill multipliers (lowercased skill label → factor on skill hits).
skillWeights:
  ci/cd: 1.2
  typescript: 1.1

weights:
  skill: 14
  corpus: 6
  title: 8
  minHit: 6
  alignedMin: 20
  partialMin: 10

# What the brief SHOWS. The matcher always evaluates every requirement it
# extracts; this only controls the surface.
#
#   false (default) - highlight mode. Shows the requirements your published
#                     work covers, and nothing else. A portfolio is advocacy;
#                     no resume enumerates what its author cannot do. The
#                     caveats say the brief isn't an exhaustive review, so it
#                     never reads as a full audit while omitting rows.
#   true            - audit mode. Also lists requirements with no published
#                     evidence, plus a Gaps section.
showGaps: false

# Appended after the two engine caveats on every brief. The demo disclaimer
# lives HERE, not in src/fit/ — an adopter who forgets to remove a hardcoded
# one would ship "this corpus is fictional" to their own recruiters.
# Delete this list (or empty it) once content/ is your real corpus.
extraCaveats:
  - Demo corpus is a placeholder (Fake Name) — replace content/ with your own YAML.
