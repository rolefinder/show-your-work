# Tenant skill-bank taxonomy (Fake Name demo).
# Adopters replace this file — core never hardcodes a person-specific map.
fallback: Other
order:
  - Platform & delivery
  - Languages & content
  - Fit & evidence
  - Interface
  - Other
map:
  CI/CD: Platform & delivery
  GitHub Actions: Platform & delivery
  Cloudflare Pages: Platform & delivery
  pipelines: Platform & delivery
  TypeScript: Languages & content
  Python: Languages & content
  YAML: Languages & content
  content pipelines: Languages & content
  YAML content pipelines: Languages & content
  Fit: Fit & evidence
  evidence: Fit & evidence
  CSS: Interface
  accessibility: Interface
  design tokens: Interface

# What each skill means, site-wide. Optional — chips render without it. Pairs
# with a work item's `skill_notes` (how it applied there) to form the two
# halves of a skill tooltip.
descriptions:
  CI/CD: Delivery gated by automated checks rather than by a green local build.
  GitHub Actions: Workflow automation for builds, gates, and preview deploys.
  Cloudflare Pages: Static hosting with edge functions and preview deployments.
  pipelines: Multi-stage build and delivery flows with explicit contracts between stages.
  TypeScript: Typed application and tooling code.
  Python: Content generation and verification tooling.
  YAML: Structured, human-authored content and configuration.
  content pipelines: Turning authored content into typed, buildable artifacts.
  Fit: Matching a job description against published evidence.
  evidence: Claims that link back to something published rather than asserted.
  CSS: Styling built from design tokens rather than literal values.
  accessibility: Contrast, keyboard reach, and semantics verified in the build.
  design tokens: A shared token layer several surfaces read from, so a palette change is one edit.
