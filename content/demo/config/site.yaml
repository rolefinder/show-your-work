# Adopter config: everything that identifies THIS deployment.
#
# Nothing below should ever be hardcoded in src/, index.html, or manifest.json
# — scripts/emit-html.ts writes those from this file at build time, so standing
# up a fork is an edit here plus your own content/, never a code change.

# The absolute origin this site is deployed at. Used for sitemap.xml,
# robots.txt, canonical/OG URLs. Cloudflare Pages assigns one, or attach your
# own domain — replace this before deploying somewhere real.
origin: "https://example.com"

# Appended after the page name in <title> ("Work — Fake Name").
# Leave empty for no suffix.
title_suffix: "Fake Name"

# Fallback <meta name="description"> and og:description, for the initial HTML
# and for routes that don't supply their own (the client sets per-route values
# on navigation).
description: "Demo portfolio for the show-your-work open-source template. Fake Name is a placeholder, not a real person."

# PWA manifest identity.
short_name: "Fake Name"

# Browser chrome color per scheme. Keep in sync with --syw-bg in
# tokens/colors.css and the dark --bg — they are the same two surfaces.
theme_color: "#f7f4ef"
theme_color_dark: "#131211"

# Which AI crawlers robots.txt invites. Both default to true, and for a site
# whose purpose is being found by a recruiter's assistant that is almost
# certainly what you want.
#
#   search    The answer engines — OAI-SearchBot, Claude-SearchBot,
#             PerplexityBot, and the user-initiated fetchers. This is your
#             distribution: block it and ChatGPT Search, Claude and Perplexity
#             stop citing you. Turning this off is opting out of AI search.
#   training  Model training corpora — GPTBot, ClaudeBot, Google-Extended,
#             CCBot and friends. The real judgement call: no per-visit
#             referral, but it is what lets a model say anything about you
#             without a live fetch. Google-Extended governs Gemini only and
#             has no effect on Google Search ranking.
#
# NOTE: robots.txt is only half of it. Cloudflare blocks these crawlers at the
# edge by DEFAULT on every zone created since 2025-07-01, regardless of what
# this file says — see docs/guide/deploy.md § Agents and answer engines.
ai_crawlers:
  search: true
  training: true

# Demo mode. TRUE ships the "this corpus is fictional" chrome (home eyebrow,
# footer line). Set to false — and clear extraCaveats in config/fit.yaml — the
# moment content/ holds your real work.
demo: true

# Where this deploys. See docs/guide/deploy.md for the full comparison.
#
#   github-pages     No new account. Needs a <username>.github.io repo or a
#                    custom domain, because the site must live at the root —
#                    every asset path here is absolute. GitHub Pages cannot
#                    set response headers, so the CSP ships as a
#                    <meta http-equiv>, which cannot express frame-ancestors,
#                    and HSTS / X-Frame-Options / COOP / CORP are unavailable.
#                    /api/fit is unavailable too; browser Fit works.
#
#   cloudflare-pages Real response headers, so _headers applies and the strict
#                    CSP is enforced as designed. Optional /api/fit Function.
#                    Needs a Cloudflare account.
deploy:
  target: github-pages

  # Optional. On GitHub Pages this is emitted as dist/CNAME, which is how a
  # custom domain is configured. Leave blank to serve at <username>.github.io.
  # If you set this, `origin` above must be the same host.
  custom_domain: ""
