name: Fake Name
tagline: Platform engineer who ships evidence-backed portfolios
location: Fake City, XX
email: fake.name@example.com
summary: >
  Fake Name is a placeholder persona for the recruit-me template — not a real
  person. The naming is deliberately obvious so a demo deploy can never be
  mistaken for someone's actual portfolio. Replace this file with your own.
skills:
  - CI/CD
  - GitHub Actions
  - Cloudflare Pages
  - TypeScript
