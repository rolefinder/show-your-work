name: Bug report
description: Something in the template behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a build gate is failing on **your own content**, that is usually the
        gate working — start with the table in
        [docs/guide](https://github.com/rolefinder/recruit-me/blob/main/docs/guide/README.md#when-something-fails).
        File here when the template itself is wrong.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      placeholder: |
        `bun run build` succeeded but /work/<slug> prerendered without a canonical.
        seo:smoke passed, so the gate missed it too.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest path from a fresh clone. If it needs specific content,
        paste the YAML — redact anything real first.
      placeholder: |
        1. git clone && bun install --frozen-lockfile && pip install pyyaml
        2. add content/work/example.yaml with the block below
        3. bun run build
        4. open dist/work/example/index.html
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: The failure output
      description: >
        The full message from the failing command. Gates are written to name
        what they found, so this is usually the most useful field.
      render: text

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`"
      placeholder: 12bda5d

  - type: input
    id: env
    attributes:
      label: Node, Python, OS
      placeholder: bun 1.2.21, node 22.14.0, python 3.13.1, Windows 11

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: "`bun run test` was run, and I have included what failed"
        - label: Chromium is installed (`bunx playwright install chromium`) — without it, prerendering and `ux:check` silently skip
        - label: No real names, employers, or credentials in anything I pasted
          required: true
