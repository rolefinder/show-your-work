# Build and publish to GitHub Pages.
#
# Enabled by setting Pages' build source to "GitHub Actions" — which
# `bun run pages:setup` does over the API, so no dashboard visit is required.
#
# This deliberately does NOT reuse ci.yml's artifact. A deploy must be built
# from the commit being deployed, with PRERENDER_REQUIRED set, so a missing
# browser fails the deploy instead of silently shipping an SPA-only site whose
# every route carries the home page's metadata.

name: deploy-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, or Pages can be left
# pointing at a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The template repository must not deploy itself. It has Pages disabled, is
  # named show-your-work rather than <owner>.github.io, and correctly carries
  # origin: https://example.com — so a deploy here would fail at the last step
  # and leave a permanently red workflow on main. "Has anyone added
  # content/about/profile.yaml?" is exactly the "this is still the template"
  # signal (ADR 021), and it needs no flag anyone has to remember to flip.
  decide:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      # Asks the checker rather than re-deciding in bash. An earlier version
      # grepped content/config/site.yaml for a demo flag, which diverged from
      # the checker on quoted, capitalised and comment-trailed values — and
      # after ADR 021 that file does not exist until an adopter adds one, so
      # the grep would hit a missing file and let the template deploy itself.
      # One parser, one answer.
      - id: check
        run: node scripts/check-pages-target.mjs --deploy-guard | tee -a "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build
        env:
          PRERENDER_REQUIRED: "1"

      # The gates that can run without a second browser session. A deploy that
      # ships an unreviewed draft, a dangling cross-link or a 404 canonical is
      # worse than a deploy that does not happen.
      - name: Verify
        run: |
          set -e
          bun run config:check
          bun run seo:smoke
          bun run fit:smoke

      # Root-path only: every asset href in the document is absolute, so a
      # project site served under /<repo>/ would 404 on all of them. Checked
      # here as well as in preflight, because this is the last point before
      # something goes public.
      - name: Confirm the site will serve at the root
        run: node scripts/check-pages-target.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: [decide, build]
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
