name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # bun installs and runs the TypeScript steps; the .mjs gates and
      # `node --check` below are still Node programs, so both runtimes are set
      # up deliberately rather than leaning on whatever the runner ships.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: bun install --frozen-lockfile
      # Prerendering AND the UX audit both need a real browser. Without this
      # the build degrades to an SPA-only dist with a warning and check-ux
      # skips - so the two checks that matter most would quietly not run.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
        # Having installed Chromium above, a skipped prerender now means
        # something broke — fail instead of silently shipping SPA-only.
        env:
          PRERENDER_REQUIRED: "1"

      # The built site, downloadable from the PR - lets you eyeball a visual
      # change without building locally.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every script must at least parse. Cheap, and it catches the class of
      # error where a branch is only exercised on some platforms.
      - name: Scripts parse
        run: |
          set -e
          for f in scripts/*.mjs; do node --check "$f"; done
          # Hooks are JS too, and a hook that does not parse fails open —
          # silently guarding nothing, which is the state it exists to prevent.
          # .claude/workflows/ is deliberately NOT here: a workflow script is
          # evaluated inside an async wrapper, so its top-level `return` is
          # legal there and a SyntaxError to `node --check`.
          for f in .claude/hooks/*.mjs; do node --check "$f"; done
          python -m compileall -q scripts packages
          echo "lint: all scripts parse"

      - name: Content and workflow YAML parses
        run: |
          pip install pyyaml >/dev/null
          python scripts/check-content.py

      # Docs quote specific numbers (Fit weights, search scoring, input caps).
      # Verified by hand once; this keeps them honest.
      - name: Docs match source
        run: node scripts/check-doc-drift.mjs

      - name: Doc links resolve
        run: node scripts/check-doc-links.mjs
