# Example Wrangler / Pages config (placeholders only)

Copy to `wrangler.toml` locally. Never commit real account IDs, tokens, or PII.

```toml
name = "show-your-work-demo"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# Optional Fit quota KV (ADR 011 stub)
# [[kv_namespaces]]
# binding = "FIT_QUOTA"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
```

Pages project + custom domain are configured in the Cloudflare dashboard or
via your own Terraform — see the `/deploy-pages` skill
(`.claude/skills/deploy-pages/SKILL.md`).
